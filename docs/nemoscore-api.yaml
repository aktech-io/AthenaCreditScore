openapi: "3.0.3"
info:
  title: NemoScore Scoring API
  version: "1.5.0"
  description: |
    Versioned contract for the NemoScore credit scoring engine (part of the
    Nemo neobank platform). This is THE contract: the LMS, portal, and any
    third-party consumer must decode against these schemas. Breaking changes
    require a major version bump and a new route prefix.

    Score scale: 300-850 (PDO-calibrated).
    Band labels (display form / canonical enum):
      Excellent  / EXCELLENT   780-850
      Very Good  / VERY_GOOD   720-779
      Good       / GOOD        680-719
      Fair       / FAIR        640-679
      Marginal   / MARGINAL    600-639
      Poor       / POOR        300-599
    Consumers MUST normalize band strings case-insensitively with spaces
    mapped to underscores.

    Authentication: Bearer JWT (portal users) or X-Api-Key (internal services,
    keys provisioned via SERVICE_API_KEYS / Kong consumers). All service
    traffic goes through Kong (rate limiting applies).

servers:
  - url: http://kong:8000
    description: In-cluster via Kong Gateway

paths:
  /api/v1/credit-score/{customerId}:
    get:
      summary: Latest persisted credit score summary
      security: [{ bearerAuth: [] }, { apiKeyAuth: [] }]
      parameters:
        - name: customerId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Latest score event
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScoreSummary" }
        "404": { description: No score exists for this customer }
        "401": { description: Missing/invalid credentials }
        "403": { description: Customer token accessing another customer }

  /api/v1/credit-report/{customerId}:
    get:
      summary: Latest full credit report (score + breakdown + bureau data)
      security: [{ bearerAuth: [] }, { apiKeyAuth: [] }]
      parameters:
        - name: customerId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Full report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FullReport" }
        "404": { description: No report exists }

  /api/v1/credit-reports:
    post:
      summary: Ingest a CRB report and run a fresh scoring pipeline
      security: [{ apiKeyAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreditReportPayload" }
      responses:
        "200":
          description: Scoring result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScoreResult" }
        "401": { description: Invalid API key }

  /api/v1/credit-score/statements/mpesa:
    post:
      summary: Upload a consumer-permissioned M-Pesa statement (CSV or PDF). Added in 1.2.0.
      description: |
        Parses the statement, dedupes (whole file by SHA-256, per transaction
        by M-Pesa receipt number), persists transactions, and refreshes the
        customer's ML feature vector. Customers may upload only their own
        statement; ADMIN/ANALYST/SERVICE may upload for any customer.
        Fails loudly: an unparseable or empty statement is a 422, never a
        silently-empty ingest.
      security: [{ bearerAuth: [] }, { apiKeyAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, customer_id]
              properties:
                file: { type: string, format: binary }
                customer_id: { type: integer, format: int64 }
                pdf_password:
                  type: string
                  description: For password-protected PDF statements (usually the national ID number).
      responses:
        "200":
          description: Ingest summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatementUploadResult" }
        "409": { description: Identical file already ingested }
        "413": { description: File larger than 10 MB }
        "422": { description: Not a parseable M-Pesa statement }

  /api/v1/credit-score/{customerId}/pricing:
    get:
      summary: Risk-based pricing from the latest score + PD. Added in 1.4.0.
      description: |
        Flat MONTHLY rates (interest on original principal — the Kenyan
        digital-lending convention), KES amounts.

        rate = base_rate(score band) + (PD × LGD) / 12, capped at
        PRICING_MAX_MONTHLY_RATE. Limit ladder: first-time borrowers get the
        band's base limit; each prior CLOSED loan adds PRICING_REPEAT_STEP
        (default 0.5) to the multiplier, up to PRICING_REPEAT_MAX_STEPS
        (default 6) steps.

        Env-overridable defaults (see also the response's rate_band_table /
        first_time_limit_table, which echo the live values):
          PRICING_RATE_BANDS      {"Excellent":0.030,"Very Good":0.040,
                                   "Good":0.055,"Fair":0.070,
                                   "Marginal":0.090,"Poor":0.120}
          PRICING_FIRST_LIMITS    {"Excellent":50000,"Very Good":30000,
                                   "Good":20000,"Fair":10000,
                                   "Marginal":5000,"Poor":2000}
          PRICING_LGD             0.55
          PRICING_MAX_MONTHLY_RATE 0.15

        A latest score with status INSUFFICIENT_DATA returns 409 — the LMS
        MUST NOT price thin files automatically; route to manual review.
      security: [{ bearerAuth: [] }, { apiKeyAuth: [] }]
      parameters:
        - name: customerId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Pricing decision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PricingResult" }
        "404": { description: No score exists — score the customer first }
        "409": { description: Latest score is INSUFFICIENT_DATA — manual review required }

  /api/v1/credit-score/{customerId}/affordability:
    post:
      summary: Affordability / DTI assessment for a requested loan. Added in 1.4.0.
      description: |
        DTI = (existing monthly obligations + new flat-rate installment) /
        gross monthly income. Decision thresholds (env-overridable):
        AFFORDABILITY_PTI_CAP (default 0.40) → AFFORDABLE at or below;
        AFFORDABILITY_STRETCH_CAP (default 0.50) → STRETCHED at or below;
        above (or income ≤ 0) → UNAFFORDABLE.

        When monthly_income is omitted it is estimated from M-Pesa cash-flow
        features (12-month statement inflow average) or, failing that, credit
        transactions over the last 180 days — 422 if neither exists. Omitted
        existing_monthly_obligations are estimated from repayments over the
        last 90 days (0 if none). The installment uses the customer's
        risk-based rate; unscored/INSUFFICIENT customers get the conservative
        Poor-band base rate (rate_source DEFAULT_POOR_BAND).
      security: [{ bearerAuth: [] }, { apiKeyAuth: [] }]
      parameters:
        - name: customerId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AffordabilityRequest" }
      responses:
        "200":
          description: Affordability assessment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AffordabilityResult" }
        "422": { description: Income not provided and not estimable from any data source }

  /api/v1/credit-score/{customerId}/simulate:
    post:
      summary: Model-backed what-if score simulation (read-only). Added in 1.4.0.
      description: |
        Applies the requested deltas to a COPY of the customer's current
        lgbm_features vector and scores both vectors through the ACTUAL
        champion model + PD calibrator + PDO transform (engine
        "lgbm:champion"). When no feature vector or registered model exists,
        falls back to a base-scorecard recompute over delta-modified
        transactions (engine "scorecard"; deltas the scorecard cannot express
        are listed in no_effect_deltas). Strictly read-only: no score event
        is written and stored features are never mutated.

        Supported deltas:
          clear_delinquencies (bool), add_monthly_savings (KES/month),
          reduce_betting_to_zero (bool), close_loans_on_time (count),
          increase_monthly_income (KES/month), improve_bureau_score (points),
          clear_fuliza (bool).
        Unknown delta names are rejected with 422 (fail-loud contract).
      security: [{ bearerAuth: [] }, { apiKeyAuth: [] }]
      parameters:
        - name: customerId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SimulateRequest" }
      responses:
        "200":
          description: Current vs simulated score
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimulateResult" }
        "422": { description: Unknown/no-op deltas, or no data at all to simulate from }
        "502": { description: Model inference failed on the simulated vector }

  /api/v1/credit-score/{customerId}/collections-priority:
    post:
      summary: Collections-priority score for a delinquent case. Added in 1.5.0.
      description: |
        Called by the LMS collections-service when a case opens or its DPD
        changes. The caller supplies the operational case state only the LMS
        knows (DPD, outstanding balance, promise-to-pay history); NemoScore
        contributes the borrower's PD and cash-flow ability-to-pay. The
        returned priority_band maps 1:1 onto the LMS CasePriority enum.

        Components (0-100 total): risk 0-30 (PD), exposure 0-30 (saturating
        in outstanding), urgency 0-25 (DPD curve peaking at 61-90 —
        roll-rate-prevention window), behaviour 0-10 (broken vs kept PTPs),
        ability 0-5 (M-Pesa cash-flow). Cutoffs and exposure reference are
        env-tunable server-side (COLLECTIONS_CUTOFF_*, COLLECTIONS_EXPOSURE_REF).

        Fail-loud: on 404/409 the LMS MUST keep its existing DPD-threshold
        prioritization (fail-closed to current behaviour, never a mock score).
      security: [{ bearerAuth: [] }, { apiKeyAuth: [] }]
      parameters:
        - name: customerId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CollectionsPriorityRequest" }
      responses:
        "200":
          description: Priority score, band, components, and recommended action
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CollectionsPriorityResult" }
        "404": { description: No score exists for this customer — score first }
        "409": { description: Latest score is INSUFFICIENT_DATA — keep DPD-based prioritization }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    apiKeyAuth: { type: apiKey, in: header, name: X-Api-Key }

  schemas:
    ScoreBand:
      type: string
      description: Display label; normalize to canonical enum for storage.
      enum: [Excellent, "Very Good", Good, Fair, Marginal, Poor]

    ScoringStatus:
      type: string
      description: |
        SCORED — decision-grade result.
        INSUFFICIENT_DATA — do NOT auto-decide; route to manual review.
      enum: [SCORED, INSUFFICIENT_DATA]

    DataSufficiency:
      type: string
      enum: [FULL, PARTIAL, INSUFFICIENT]
      description: FULL ≥3 months transactions; PARTIAL = thin file with bureau data.

    ReasonCode:
      type: object
      required: [code, description]
      description: |
        Deterministic adverse-action reason (ECOA-style). Codes are stable
        NSxx identifiers; descriptions are customer-safe display text.
        Derived from SHAP contributions when the PD came from the ML model,
        from scorecard dimension deficits + bureau red flags otherwise.
        Never produced by the LLM.
      properties:
        code: { type: string, example: NS03 }
        description: { type: string, example: Low credit bureau score }

    ScoreSummary:
      type: object
      required: [customer_id, final_score, score_band, pd_probability, status]
      properties:
        customer_id: { type: integer, format: int64 }
        final_score: { type: integer, minimum: 300, maximum: 850 }
        score_band: { $ref: "#/components/schemas/ScoreBand" }
        pd_probability: { type: number, minimum: 0, maximum: 1 }
        scored_at: { type: string }
        status: { $ref: "#/components/schemas/ScoringStatus" }
        data_sufficiency:
          type: string
          enum: [FULL, PARTIAL, INSUFFICIENT]
          description: Added in 1.3.0. Persisted per event; INSUFFICIENT pairs with status INSUFFICIENT_DATA.
        pd_source:
          type: string
          description: Added in 1.3.0. "lgbm:champion", "lgbm:challenger" or "scorecard" — provenance of the PD that served this event.
        model_version:
          type: string
          description: Added in 1.3.0. MLflow registry version of the PD model, when pd_source is an lgbm target.

    ScoreResult:
      type: object
      required: [customer_id, final_score, score_band, pd_probability, status]
      properties:
        customer_id: { type: integer, format: int64 }
        base_score: { type: number, description: Rule-based scorecard total (300-700) }
        crb_contribution: { type: number, minimum: -100, maximum: 150 }
        llm_adjustment:
          type: integer
          description: Capped qualitative overlay; never crosses a band boundary.
        pd_probability: { type: number, minimum: 0, maximum: 1 }
        final_score: { type: integer, minimum: 300, maximum: 850 }
        score_band: { $ref: "#/components/schemas/ScoreBand" }
        reasoning: { type: array, items: { type: string } }
        llm_provider: { type: string }
        llm_model: { type: string }
        scored_at: { type: string }
        status: { $ref: "#/components/schemas/ScoringStatus" }
        data_sufficiency: { $ref: "#/components/schemas/DataSufficiency" }
        pd_source:
          type: string
          description: "\"lgbm:champion\", \"lgbm:challenger\", or \"scorecard\" (fallback)."
        model_version:
          type: string
          nullable: true
          description: MLflow registry version when pd_source is an ML model.
        reason_codes:
          type: array
          maxItems: 4
          items: { $ref: "#/components/schemas/ReasonCode" }
          description: Top adverse-action reasons, most severe first. Added in 1.1.0.

    FullReport:
      allOf:
        - $ref: "#/components/schemas/ScoreResult"
        - type: object
          properties:
            customer_name: { type: string }
            crb_name: { type: string, nullable: true }
            bureau_score: { type: integer, nullable: true }

    StatementUploadResult:
      type: object
      required: [statement_id, customer_id, transactions_ingested, duplicates_skipped]
      properties:
        statement_id: { type: integer, format: int64 }
        customer_id: { type: integer, format: int64 }
        source_format: { type: string, enum: [CSV, PDF] }
        period_start: { type: string, format: date, nullable: true }
        period_end: { type: string, format: date, nullable: true }
        transactions_ingested: { type: integer }
        duplicates_skipped:
          type: integer
          description: Rows whose receipt number was already ingested (overlapping statements).
        category_totals:
          type: object
          additionalProperties: { type: number }
          description: Sum of amounts per ML category for newly ingested rows.
        features_recomputed: { type: boolean }

    CreditReportPayload:
      type: object
      required: [customer, creditReport]
      properties:
        customer:
          type: object
          required: [nationalId, firstName, lastName]
          properties:
            nationalId: { type: string }
            firstName: { type: string }
            lastName: { type: string }
            phone: { type: string, nullable: true }
            email: { type: string, nullable: true }
        creditReport:
          type: object
          description: Raw CRB report (bureau-specific shape, stored verbatim).

    # ── Added in 1.4.0 — decisioning + simulator ───────────────────────────

    PricingResult:
      type: object
      description: Added in 1.4.0. Amounts KES; rates are flat monthly.
      required: [customer_id, final_score, score_band, pd_probability, rate, limit]
      properties:
        customer_id: { type: integer, format: int64 }
        currency: { type: string, enum: [KES] }
        rate_type: { type: string, enum: [FLAT_MONTHLY] }
        final_score: { type: integer, minimum: 300, maximum: 850 }
        score_band:
          allOf: [{ $ref: "#/components/schemas/ScoreBand" }]
          description: Derived from final_score (stored legacy labels are ignored).
        pd_probability: { type: number, minimum: 0, maximum: 1 }
        scored_at: { type: string }
        rate:
          type: object
          required: [base_monthly_rate, risk_premium_monthly, monthly_rate]
          properties:
            base_monthly_rate: { type: number, description: Band base flat monthly rate }
            risk_premium_monthly: { type: number, description: (PD × LGD) / 12 }
            monthly_rate: { type: number, description: base + premium, capped }
            capped: { type: boolean }
            lgd: { type: number }
        limit:
          type: object
          required: [borrower_type, max_loan_amount]
          properties:
            borrower_type: { type: string, enum: [FIRST_TIME, REPEAT] }
            closed_loans: { type: integer, description: Prior CLOSED loans counted for the ladder }
            base_limit: { type: number, description: First-time limit for the band (KES) }
            multiplier: { type: number, description: 1 + PRICING_REPEAT_STEP × min(closed_loans, PRICING_REPEAT_MAX_STEPS) }
            max_loan_amount: { type: number, description: base_limit × multiplier (KES) }
        rate_band_table:
          type: object
          additionalProperties: { type: number }
          description: Live band → base monthly rate table (after env overrides).
        first_time_limit_table:
          type: object
          additionalProperties: { type: number }
          description: Live band → first-time limit table (after env overrides).

    AffordabilityRequest:
      type: object
      description: Added in 1.4.0.
      required: [requested_amount, term_months]
      properties:
        requested_amount: { type: number, exclusiveMinimum: 0, description: Principal, KES }
        term_months: { type: integer, minimum: 1, maximum: 60 }
        monthly_income:
          type: number
          minimum: 0
          nullable: true
          description: Gross monthly income (KES); estimated when omitted.
        existing_monthly_obligations:
          type: number
          minimum: 0
          nullable: true
          description: Existing monthly debt service (KES); estimated when omitted.

    AffordabilityDecision:
      type: string
      description: Added in 1.4.0. Hint only — the LMS owns the final decision.
      enum: [AFFORDABLE, STRETCHED, UNAFFORDABLE]

    AffordabilityResult:
      type: object
      description: Added in 1.4.0. Amounts KES; rate is flat monthly.
      required: [customer_id, monthly_income, monthly_installment, decision]
      properties:
        customer_id: { type: integer, format: int64 }
        currency: { type: string, enum: [KES] }
        rate_type: { type: string, enum: [FLAT_MONTHLY] }
        income_source: { type: string, enum: [PROVIDED, MPESA_STATEMENTS, TRANSACTIONS_180D] }
        obligations_source: { type: string, enum: [PROVIDED, REPAYMENTS_90D, NONE_OBSERVED] }
        rate_source:
          type: string
          enum: [RISK_BASED, DEFAULT_POOR_BAND]
          description: DEFAULT_POOR_BAND when the customer has no usable score.
        score_band:
          allOf: [{ $ref: "#/components/schemas/ScoreBand" }]
          nullable: true
        monthly_income: { type: number }
        existing_monthly_obligations: { type: number }
        requested_amount: { type: number }
        term_months: { type: integer }
        monthly_rate: { type: number }
        monthly_installment: { type: number }
        total_repayable: { type: number, description: principal × (1 + rate × term) }
        dti_current:
          type: number
          nullable: true
          description: obligations / income; null when income is 0.
        dti_with_loan:
          type: number
          nullable: true
          description: (obligations + installment) / income; null when income is 0.
        disposable_income_after_loan: { type: number }
        pti_cap: { type: number, description: AFFORDABILITY_PTI_CAP in force (default 0.40) }
        max_affordable_installment: { type: number, description: max(0, pti_cap × income − obligations) }
        max_loan_amount: { type: number, description: Principal whose installment equals max_affordable_installment at this rate/term }
        decision: { $ref: "#/components/schemas/AffordabilityDecision" }

    SimulateRequest:
      type: object
      description: Added in 1.4.0. Unknown delta names → 422.
      required: [deltas]
      properties:
        deltas:
          type: object
          description: |
            What-if deltas. Boolean switches: clear_delinquencies,
            reduce_betting_to_zero, clear_fuliza. Positive numbers:
            add_monthly_savings (KES), increase_monthly_income (KES),
            close_loans_on_time (count), improve_bureau_score (points).
          additionalProperties: true
          example:
            clear_delinquencies: true
            add_monthly_savings: 5000
            reduce_betting_to_zero: true

    SimulatedScorePoint:
      type: object
      description: Added in 1.4.0.
      required: [score, score_band, pd_probability]
      properties:
        score: { type: integer, minimum: 300, maximum: 850 }
        score_band: { $ref: "#/components/schemas/ScoreBand" }
        pd_probability: { type: number, minimum: 0, maximum: 1 }

    SimulateResult:
      type: object
      description: |
        Added in 1.4.0. Read-only guarantee: simulation never writes a score
        event and never mutates stored features.
      required: [customer_id, engine, current, simulated, score_delta]
      properties:
        customer_id: { type: integer, format: int64 }
        engine:
          type: string
          enum: ["lgbm:champion", scorecard]
          description: Which engine produced BOTH points (never mixed).
        model_version: { type: string, nullable: true }
        current: { $ref: "#/components/schemas/SimulatedScorePoint" }
        simulated: { $ref: "#/components/schemas/SimulatedScorePoint" }
        score_delta: { type: integer }
        delta_impacts:
          type: array
          description: One-at-a-time attribution, largest absolute score impact first.
          items:
            type: object
            properties:
              delta: { type: string }
              value: {}
              score_impact: { type: integer, nullable: true }
        no_effect_deltas:
          type: array
          items: { type: string }
          description: Deltas the scorecard fallback cannot express (empty on the ML path).
        read_only: { type: boolean }

    CollectionsPriorityRequest:
      type: object
      required: [dpd, outstanding_amount]
      properties:
        dpd: { type: integer, minimum: 0, description: Current days past due }
        outstanding_amount: { type: number, minimum: 0, description: Outstanding balance, KES }
        broken_ptp_count: { type: integer, minimum: 0, default: 0 }
        fulfilled_ptp_count: { type: integer, minimum: 0, default: 0 }
        product_type: { type: string, nullable: true, description: Echoed back; not scored }

    CollectionsPriorityResult:
      type: object
      description: Added in 1.5.0. priority_band maps 1:1 onto the LMS CasePriority enum.
      required: [customer_id, priority_score, priority_band, components,
                 ability_to_pay, recommended_action, final_score, pd_probability]
      properties:
        customer_id: { type: integer, format: int64 }
        currency: { type: string, enum: [KES] }
        product_type: { type: string, nullable: true }
        dpd: { type: integer }
        outstanding_amount: { type: number }
        priority_score: { type: number, minimum: 0, maximum: 100 }
        priority_band:
          type: string
          enum: [LOW, NORMAL, HIGH, CRITICAL]
        components:
          type: object
          description: Additive breakdown; values sum to priority_score.
          properties:
            risk: { type: number }
            exposure: { type: number }
            urgency: { type: number }
            behaviour: { type: number }
            ability: { type: number }
        ability_to_pay:
          type: string
          enum: [STRONG, WEAK, UNKNOWN]
          description: Cash-flow ability from M-Pesa features; UNKNOWN without statement data.
        recommended_action:
          type: string
          enum: [NONE, SELF_CURE_WATCH, SOFT_REMINDER, PRIORITY_CALL,
                 RESTRUCTURE_OFFER, FIELD_VISIT, LEGAL_REVIEW]
          description: Default next-best-action; the LMS strategy engine may override.
        final_score: { type: integer, description: Latest persisted credit score (provenance) }
        pd_probability: { type: number }
        scored_at: { type: string }
