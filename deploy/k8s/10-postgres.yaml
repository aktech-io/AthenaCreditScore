apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: nemoscore
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
# Single-node Postgres. Schema + migrations are applied by the postgres image's
# /docker-entrypoint-initdb.d mechanism (same as docker-compose): the
# postgres-init ConfigMap (generated from deploy/k8s/postgres-init/*.sql) is
# mounted there and runs ONLY on first boot with an empty data volume. GORM
# AutoMigrate in the Go services covers their own tables at startup.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: nemoscore
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              value: athena
            - name: POSTGRES_DB
              value: athena_db
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nemoscore-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "athena", "-d", "athena_db"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: init
          configMap:
            name: postgres-init
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 5Gi
