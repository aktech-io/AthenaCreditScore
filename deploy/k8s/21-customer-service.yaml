apiVersion: v1
kind: Service
metadata:
  name: customer-service
  namespace: nemoscore
spec:
  selector:
    app: customer-service
  ports:
    - port: 8082
      targetPort: 8082
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-service
  namespace: nemoscore
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customer-service
  template:
    metadata:
      labels:
        app: customer-service
    spec:
      containers:
        - name: customer-service
          image: nemoscore/customer-service:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: nemoscore-config
          env:
            - name: PORT
              value: "8082"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: nemoscore-secrets, key: POSTGRES_PASSWORD }
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef: { name: nemoscore-secrets, key: RABBITMQ_URL }
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: nemoscore-secrets, key: JWT_SECRET }
          ports:
            - containerPort: 8082
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 10
