apiVersion: v1
kind: Service
metadata:
  name: media-service
  namespace: nemoscore
spec:
  selector:
    app: media-service
  ports:
    - port: 8083
      targetPort: 8083
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-storage
  namespace: nemoscore
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-service
  namespace: nemoscore
spec:
  replicas: 1
  strategy:
    type: Recreate # RWO storage PVC — old and new pod can't mount together
  selector:
    matchLabels:
      app: media-service
  template:
    metadata:
      labels:
        app: media-service
    spec:
      containers:
        - name: media-service
          image: nemoscore/media-service:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: nemoscore-config
          env:
            - name: PORT
              value: "8083"
            - name: STORAGE_LOCATION
              value: /app/storage
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: nemoscore-secrets, key: POSTGRES_PASSWORD }
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: nemoscore-secrets, key: JWT_SECRET }
          ports:
            - containerPort: 8083
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: storage
              mountPath: /app/storage
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: media-storage
