apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: nemoscore
spec:
  selector:
    app: notification-service
  ports:
    - port: 8085
      targetPort: 8085
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: nemoscore
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: nemoscore/notification-service:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: nemoscore-config
          env:
            - name: PORT
              value: "8085"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: nemoscore-secrets, key: POSTGRES_PASSWORD }
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef: { name: nemoscore-secrets, key: RABBITMQ_URL }
          ports:
            - containerPort: 8085
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            initialDelaySeconds: 5
            periodSeconds: 10
