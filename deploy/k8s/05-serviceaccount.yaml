# The nemoscore-* images are PRIVATE on ghcr.io/aktech-io, so every pod needs a
# pull secret. Rather than repeat imagePullSecrets on each Deployment, attach it
# once to the namespace's default ServiceAccount (all pods use it).
#
# You MUST create the `ghcr-pull` secret before/with apply (see README):
#   kubectl -n nemoscore create secret docker-registry ghcr-pull \
#     --docker-server=ghcr.io \
#     --docker-username=<github-username> \
#     --docker-password=<GHCR_PAT_with_read:packages> \
#     --docker-email=tech@aktech.co.ke
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: nemoscore
imagePullSecrets:
  - name: ghcr-pull
