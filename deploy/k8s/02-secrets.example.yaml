# TEMPLATE — copy to 02-secrets.yaml, fill real values, keep it OUT of git
# (deploy/k8s/02-secrets.yaml is gitignored; this .example documents the shape).
#
# Generate values:
#   POSTGRES_PASSWORD        openssl rand -hex 16
#   RABBITMQ_PASS            openssl rand -hex 16
#   JWT_SECRET               openssl rand -base64 32
#       MUST be base64 text of 32 random bytes — the Go services
#       (pkg/athena/jwt) and python (auth/jwt_handler.py) base64-DECODE this
#       value before signing/verifying. Do not use a plain random string.
#   SERVICE_API_KEYS         openssl rand -hex 32   (comma-separate for multiple)
#       Strong per-consumer service keys, NOT "dev-key". The Nemo LMS
#       ai-scoring-service sends one of these as X-Api-Key (its SCORING_API_KEY
#       env). Rotate by appending a new key, migrating callers, then removing.
#   SCORING_ENGINE_API_KEY   one of the SERVICE_API_KEYS values
#       Used by scoring-service when proxying to the python engine.
#
# DATABASE_URL / RABBITMQ_URL are full DSNs — keep them in sync with the
# passwords above.
apiVersion: v1
kind: Secret
metadata:
  name: nemoscore-secrets
  namespace: nemoscore
type: Opaque
stringData:
  POSTGRES_PASSWORD: "CHANGE_ME_pg"
  RABBITMQ_USER: "athena"
  RABBITMQ_PASS: "CHANGE_ME_amqp"
  RABBITMQ_URL: "amqp://athena:CHANGE_ME_amqp@rabbitmq:5672/"
  # python service (asyncpg) DSN
  DATABASE_URL: "postgresql+asyncpg://athena:CHANGE_ME_pg@postgres:5432/athena_db"
  # mlflow backend store (psycopg2) DSN
  MLFLOW_BACKEND_STORE_URI: "postgresql://athena:CHANGE_ME_pg@postgres:5432/mlflow_db"
  JWT_SECRET: "CHANGE_ME_base64_32_bytes"
  SERVICE_API_KEYS: "CHANGE_ME_hex64"
  SCORING_ENGINE_API_KEY: "CHANGE_ME_hex64_same_as_one_of_SERVICE_API_KEYS"
  # ── External integrations (empty = feature disabled / unreachable) ──
  OPENAI_API_KEY: ""
  MIFOS_BASE_URL: ""
  MIFOS_USERNAME: ""
  MIFOS_PASSWORD: ""
  TRANSUNION_API_KEY: ""
  METROPOL_API_KEY: ""
