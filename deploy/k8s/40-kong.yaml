# Kong API gateway (DB-less, declarative config from the kong-config ConfigMap,
# generated by kustomization.yaml from deploy/k8s/kong.yml — a copy of
# ../../kong/kong.yml; keep the two in sync).
#
# Kong is the API edge for the NemoScore scoring contract: the Nemo LMS
# (namespace `lms` on the same cluster) calls
#   http://kong.nemoscore.svc.cluster.local:8000/api/v1/credit-score/{id}
# with X-Api-Key (validated by the python service against SERVICE_API_KEYS).
#
# The admin API (8444) is NOT exposed as a Service port — ClusterIP only via
# port-forward to the pod if ever needed.
#
# PROD NOTE: kong.yml ships a `dev-partner`/`dev-key` key-auth consumer for the
# /api/v1/credit-reports and /api/v3p routes — replace that key with a strong
# per-partner key before production exposure.
apiVersion: v1
kind: Service
metadata:
  name: kong
  namespace: nemoscore
spec:
  selector:
    app: kong
  ports:
    - name: proxy
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong
  namespace: nemoscore
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kong
  template:
    metadata:
      labels:
        app: kong
    spec:
      containers:
        - name: kong
          image: kong:3.6-ubuntu
          env:
            - name: KONG_DATABASE
              value: "off"
            - name: KONG_DECLARATIVE_CONFIG
              value: /etc/kong/kong.yml
            - name: KONG_PROXY_ACCESS_LOG
              value: /dev/stdout
            - name: KONG_ADMIN_ACCESS_LOG
              value: /dev/stdout
            - name: KONG_PROXY_ERROR_LOG
              value: /dev/stderr
            - name: KONG_ADMIN_ERROR_LOG
              value: /dev/stderr
            - name: KONG_ADMIN_LISTEN
              value: "127.0.0.1:8444" # admin stays pod-local
            - name: KONG_STATUS_LISTEN
              value: "0.0.0.0:8100" # readiness probe
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: kong-config
              mountPath: /etc/kong
              readOnly: true
          readinessProbe:
            httpGet:
              path: /status
              port: 8100
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: kong-config
          configMap:
            name: kong-config
            items:
              - key: kong.yml
                path: kong.yml
